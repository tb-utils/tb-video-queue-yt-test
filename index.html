<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube Queue</title>
<style>
:root{color-scheme:light dark;--bg:Canvas;--fg:CanvasText;--muted:color-mix(in srgb,CanvasText 58%,transparent);--border:color-mix(in srgb,CanvasText 22%,transparent);--panel:color-mix(in srgb,Canvas 94%,CanvasText 6%);--playing:color-mix(in srgb,#4caf50 18%,Canvas)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}.app{max-width:1100px;margin:0 auto;padding:16px}h1{margin:0 0 10px;font-size:1.45rem}.hint{margin:0 0 12px;color:var(--muted)}.file-warning{display:none;border:1px solid #b8860b;padding:10px 12px;border-radius:8px;margin-bottom:12px}.player-wrap{width:100%;aspect-ratio:16/9;background:#111;border-radius:10px;overflow:hidden;position:relative;margin-bottom:14px}#playerHost,#player{width:100%;height:100%}.player-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;text-align:center;padding:20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button{padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--fg);cursor:pointer}button:disabled{opacity:.5;cursor:default}.queue-box{border:1px solid var(--border);border-radius:10px;overflow:hidden;min-height:180px;background:var(--panel)}.queue-head{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border);align-items:center}.queue-title{font-weight:700}.queue-meta{color:var(--muted);font-size:.9rem}#queue{list-style:none;margin:0;padding:0}.item{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--border)}.item:last-child{border-bottom:0}.item.playing{background:var(--playing)}.item.selected{outline:2px solid color-mix(in srgb,#4285f4 55%,transparent);outline-offset:-2px}.num{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}.mainline{min-width:0}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subline{margin-top:2px;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-actions{display:flex;gap:4px}.item-actions button{padding:5px 8px;min-width:34px}.empty{padding:24px 12px;color:var(--muted);text-align:center}.status{margin-top:10px;min-height:1.5em;color:var(--muted);font-size:.9rem}.context-menu{position:fixed;z-index:1000;display:none;min-width:190px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.22);padding:5px}.context-menu button{display:block;width:100%;text-align:left;border:0;background:transparent}@media(max-width:640px){.item{grid-template-columns:34px 1fr}.item-actions{grid-column:2}}
</style>
</head>
<body>
<div class="app">
<h1>YouTube Queue</h1>
<p class="hint">YouTube URL をコピーして、このページで <strong>Ctrl+V</strong>。右クリック →「クリップボードから追加」でも追加できます。</p>
<div id="fileWarning" class="file-warning">このページは <code>file://</code> で開かれています。タイトル取得は動く場合がありますが、YouTube 埋め込み再生はエラー153になることがあります。GitHub Pages など HTTPS 上で使用してください。</div>
<div class="player-wrap"><div id="playerHost"><div class="player-placeholder">キューへ動画を追加し、「再生」を押してください。</div></div></div>
<div class="toolbar"><button id="playBtn">再生</button><button id="prevBtn">前へ</button><button id="nextBtn">次へ</button><button id="removeBtn">選択を削除</button><button id="clearBtn">すべてクリア</button></div>
<div id="queueBox" class="queue-box" tabindex="0"><div class="queue-head"><div class="queue-title">Queue</div><div id="queueMeta" class="queue-meta">0 videos</div></div><ol id="queue"></ol></div>
<div id="status" class="status"></div>
</div>
<div id="contextMenu" class="context-menu"><button id="ctxPaste">クリップボードから追加</button><button id="ctxPlay">選択を再生</button><button id="ctxDelete">選択を削除</button></div>
<script>
(()=>{"use strict";
const STORAGE_KEY="youtubeQueue.v1",CURRENT_KEY="youtubeQueue.currentIndex.v1";
const $=id=>document.getElementById(id);const e={queue:$("queue"),queueBox:$("queueBox"),queueMeta:$("queueMeta"),status:$("status"),playBtn:$("playBtn"),prevBtn:$("prevBtn"),nextBtn:$("nextBtn"),removeBtn:$("removeBtn"),clearBtn:$("clearBtn"),fileWarning:$("fileWarning"),playerHost:$("playerHost"),contextMenu:$("contextMenu"),ctxPaste:$("ctxPaste"),ctxPlay:$("ctxPlay"),ctxDelete:$("ctxDelete")};
let queue=loadQueue(),currentIndex=loadCurrentIndex(),selectedIndex=queue.length?Math.min(Math.max(currentIndex,0),queue.length-1):-1,player=null,playerReady=false,pendingPlayIndex=null;
if(location.protocol==="file:")e.fileWarning.style.display="block";
function setStatus(s){e.status.textContent=s||""}function saveQueue(){localStorage.setItem(STORAGE_KEY,JSON.stringify(queue))}function loadQueue(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");return Array.isArray(v)?v.filter(x=>x&&x.videoId):[]}catch{return[]}}function saveCurrentIndex(){localStorage.setItem(CURRENT_KEY,String(currentIndex))}function loadCurrentIndex(){const n=Number(localStorage.getItem(CURRENT_KEY));return Number.isFinite(n)?n:0}function norm(i){if(!queue.length)return-1;return Math.max(0,Math.min(i,queue.length-1))}
function extractVideoId(text){const s=String(text||"").trim();if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;try{const u=new URL(s);if(u.hostname==="youtu.be"){const id=u.pathname.split("/").filter(Boolean)[0];return/^[A-Za-z0-9_-]{11}$/.test(id||"")?id:null}if(u.hostname==="youtube.com"||u.hostname.endsWith(".youtube.com")){if(u.pathname==="/watch"){const id=u.searchParams.get("v");return/^[A-Za-z0-9_-]{11}$/.test(id||"")?id:null}const p=u.pathname.split("/").filter(Boolean);if(["embed","shorts","live"].includes(p[0])){const id=p[1];return/^[A-Za-z0-9_-]{11}$/.test(id||"")?id:null}}}catch{}return null}
async function fetchTitle(id){const watch=`https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;const url=`https://www.youtube.com/oembed?url=${encodeURIComponent(watch)}&format=json`;const r=await fetch(url);if(!r.ok)throw new Error(`oEmbed HTTP ${r.status}`);const d=await r.json();return d&&d.title?d.title:id}
async function addFromText(text){const parts=String(text||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean),ids=[],bad=[];for(const p of parts){const id=extractVideoId(p);id?ids.push(id):bad.push(p)}if(!ids.length){setStatus("YouTube URL を認識できませんでした。");return}let added=0;for(const id of ids){const existing=queue.findIndex(x=>x.videoId===id);if(existing>=0){selectedIndex=existing;continue}queue.push({videoId:id,title:"タイトル取得中…",url:`https://www.youtube.com/watch?v=${id}`});const my=queue.length-1;if(selectedIndex<0)selectedIndex=my;added++;saveQueue();render();try{const title=await fetchTitle(id),idx=queue.findIndex(x=>x.videoId===id);if(idx>=0){queue[idx].title=title;saveQueue();render()}}catch{const idx=queue.findIndex(x=>x.videoId===id);if(idx>=0){queue[idx].title=`(タイトル取得失敗) ${id}`;saveQueue();render()}}}setStatus(`${added} 件追加${bad.length?` / 認識できない行 ${bad.length} 件`:""}`)}
function render(){e.queue.innerHTML="";e.queueMeta.textContent=`${queue.length} video${queue.length===1?"":"s"}`;if(!queue.length){e.queue.innerHTML='<li class="empty">Ctrl+V で YouTube URL を追加</li>';selectedIndex=-1;currentIndex=0;saveCurrentIndex();buttons();return}currentIndex=norm(currentIndex);selectedIndex=norm(selectedIndex);queue.forEach((it,i)=>{const li=document.createElement("li");li.className="item";if(i===currentIndex&&player)li.classList.add("playing");if(i===selectedIndex)li.classList.add("selected");li.dataset.index=i;const num=document.createElement("div");num.className="num";num.textContent=i+1;const main=document.createElement("div");main.className="mainline";const t=document.createElement("div");t.className="title";t.textContent=it.title||it.videoId;t.title=t.textContent;const sub=document.createElement("div");sub.className="subline";sub.textContent=it.url;main.append(t,sub);const act=document.createElement("div");act.className="item-actions";const up=document.createElement("button");up.textContent="↑";up.title="上へ";up.disabled=i===0;up.onclick=ev=>{ev.stopPropagation();moveItem(i,i-1)};const down=document.createElement("button");down.textContent="↓";down.title="下へ";down.disabled=i===queue.length-1;down.onclick=ev=>{ev.stopPropagation();moveItem(i,i+1)};const del=document.createElement("button");del.textContent="×";del.title="削除";del.onclick=ev=>{ev.stopPropagation();deleteIndex(i)};act.append(up,down,del);li.append(num,main,act);li.onclick=()=>{selectedIndex=i;render()};li.ondblclick=()=>playIndex(i);e.queue.append(li)});buttons()}
function buttons(){const h=queue.length>0;e.playBtn.disabled=!h;e.prevBtn.disabled=!h;e.nextBtn.disabled=!h;e.removeBtn.disabled=selectedIndex<0;e.clearBtn.disabled=!h}
function moveItem(from,to){if(to<0||to>=queue.length||from===to)return;const [it]=queue.splice(from,1);queue.splice(to,0,it);if(currentIndex===from)currentIndex=to;else if(from<currentIndex&&to>=currentIndex)currentIndex--;else if(from>currentIndex&&to<=currentIndex)currentIndex++;if(selectedIndex===from)selectedIndex=to;else if(from<selectedIndex&&to>=selectedIndex)selectedIndex--;else if(from>selectedIndex&&to<=selectedIndex)selectedIndex++;saveQueue();saveCurrentIndex();render()}
function deleteIndex(i){if(i<0||i>=queue.length)return;queue.splice(i,1);if(!queue.length){currentIndex=0;selectedIndex=-1}else{if(i<currentIndex)currentIndex--;else if(i===currentIndex)currentIndex=Math.min(currentIndex,queue.length-1);if(i<selectedIndex)selectedIndex--;else if(i===selectedIndex)selectedIndex=Math.min(selectedIndex,queue.length-1)}saveQueue();saveCurrentIndex();render()}
function clearQueue(){if(!queue.length||!confirm("キューをすべて削除しますか？"))return;queue=[];currentIndex=0;selectedIndex=-1;saveQueue();saveCurrentIndex();render();if(player&&player.stopVideo)player.stopVideo();setStatus("キューをクリアしました。")}
function ensureApi(){if(window.YT&&YT.Player)return;const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s)}window.onYouTubeIframeAPIReady=()=>{if(pendingPlayIndex!=null){const i=pendingPlayIndex;pendingPlayIndex=null;playIndex(i)}};
function createPlayer(id){e.playerHost.innerHTML='<div id="player"></div>';const vars={controls:1,rel:0};if(location.protocol==="https:"||location.protocol==="http:")vars.origin=location.origin;player=new YT.Player("player",{width:"100%",height:"100%",videoId:id,playerVars:vars,events:{onReady:ev=>{playerReady=true;ev.target.playVideo();render()},onStateChange:ev=>{if(ev.data===YT.PlayerState.ENDED)playNext()},onError:ev=>setStatus(`YouTube Player error: ${ev.data}`)}})}
function playIndex(i){if(!queue.length)return;i=norm(i);currentIndex=i;selectedIndex=i;saveCurrentIndex();render();const id=queue[i].videoId;if(!(window.YT&&YT.Player)){pendingPlayIndex=i;ensureApi();setStatus("YouTube Player API を読み込み中…");return}if(!player){createPlayer(id);setStatus("");return}if(playerReady&&player.loadVideoById){player.loadVideoById(id);setStatus("");render()}else pendingPlayIndex=i}
function playNext(){if(!queue.length)return;if(currentIndex+1<queue.length)playIndex(currentIndex+1);else setStatus("キューの最後まで再生しました。")}function playPrev(){if(queue.length)playIndex(Math.max(0,currentIndex-1))}
async function pasteClipboard(){try{const t=await navigator.clipboard.readText();if(!t.trim())return setStatus("クリップボードが空です。");await addFromText(t)}catch{setStatus("クリップボードを直接読めませんでした。Ctrl+V を使ってください。")}}
document.addEventListener("paste",ev=>{const t=ev.target;if(t&&["INPUT","TEXTAREA"].includes(t.tagName))return;const s=ev.clipboardData&&ev.clipboardData.getData("text");if(s){ev.preventDefault();addFromText(s)}});e.playBtn.onclick=()=>queue.length&&playIndex(selectedIndex>=0?selectedIndex:currentIndex);e.nextBtn.onclick=playNext;e.prevBtn.onclick=playPrev;e.removeBtn.onclick=()=>deleteIndex(selectedIndex);e.clearBtn.onclick=clearQueue;
e.queueBox.oncontextmenu=ev=>{ev.preventDefault();const item=ev.target.closest(".item");if(item){selectedIndex=Number(item.dataset.index);render()}e.contextMenu.style.left=`${Math.min(ev.clientX,window.innerWidth-200)}px`;e.contextMenu.style.top=`${Math.min(ev.clientY,window.innerHeight-150)}px`;e.contextMenu.style.display="block";e.ctxPlay.disabled=selectedIndex<0;e.ctxDelete.disabled=selectedIndex<0};document.addEventListener("click",ev=>{if(!e.contextMenu.contains(ev.target))e.contextMenu.style.display="none"});e.ctxPaste.onclick=async()=>{e.contextMenu.style.display="none";await pasteClipboard()};e.ctxPlay.onclick=()=>{e.contextMenu.style.display="none";if(selectedIndex>=0)playIndex(selectedIndex)};e.ctxDelete.onclick=()=>{e.contextMenu.style.display="none";if(selectedIndex>=0)deleteIndex(selectedIndex)};
render();
})();
</script>
</body>
</html>
